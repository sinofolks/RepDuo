name: RepDuo
options:
  bundleIdPrefix: com.repduo
  developmentLanguage: en
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "1.0.2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 35J449VWJ2
    GENERATE_INFOPLIST_FILE: NO
targets:
  RepDuo:
    type: application
    platform: iOS
    sources:
      - path: RepDuo
        excludes:
          - SupportingFiles/Info.plist
    info:
      path: RepDuo/SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: RepDuo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSCameraUsageDescription: RepDuo uses the camera to count squats and push-ups on this iPhone. Video is not saved or uploaded.
        NSPhotoLibraryAddUsageDescription: RepDuo saves the result card you choose to your photo library. Nothing else is accessed.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repduo.ios
        PRODUCT_NAME: RepDuo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  RepDuoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepDuoTests
    dependencies:
      - target: RepDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repduo.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  RepDuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RepDuoUITests
    dependencies:
      - target: RepDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repduo.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RepDuo:
    build:
      targets:
        RepDuo: all
        RepDuoTests: [test]
        RepDuoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: RepDuoTests
          parallelizable: true
        - name: RepDuoUITests
          parallelizable: false
